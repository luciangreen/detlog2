name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
      - name: Install SWI-Prolog (for the mnns bridge tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-nox
      - name: Fetch mnns
        run: git clone --depth 1 https://github.com/luciangreen/mnns "$RUNNER_TEMP/mnns"
      - name: Build and test
        env:
          MNNS_DIR: ${{ runner.temp }}/mnns
        run: |
          ./scripts/ci.sh
