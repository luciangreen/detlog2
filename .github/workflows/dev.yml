name: dev
on:
  push:
    branches: [prolog]
jobs:
  prolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-nox
      - name: cut-free check
        run: swipl tools/cutfree.pl -- detlog2.pl src/*.pl io/ios.pl tests/*.pl tools/cutfree.pl || true
      - name: build
        run: mkdir -p build && swipl -o build/detlog2 -c detlog2.pl 2>&1 | grep -v "Disabled autoloading" | tail -40
      - name: cli tests
        run: |
          git clone -q --depth 1 https://github.com/luciangreen/mnns ../mnns
          MNNS_DIR=$PWD/../mnns swipl tests/cli.pl || true
      - name: ios diff
        run: |
          swipl io/ios.pl write build/ios_now.txt || true
          diff io/ios.txt build/ios_now.txt > build/ios.diff || true; echo "diff lines: $(wc -l < build/ios.diff)"
          head -60 build/ios.diff
